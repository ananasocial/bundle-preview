<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>חד · אופציה</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<style>
  :root { --night: #120806; --ink: #FFF6F0; --ink-2: #E9D6CB; --ink-3: #C9A99B; --coral: #FF5A57;
          --grad: linear-gradient(270deg, #FCCBF0 0%, #FD92A3 45%, #FF5A57 100%); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); overflow-x: clip; }
  body { font-family: var(--font-he, "Almoni", system-ui, sans-serif); }
  h2, p { margin: 0; }
  .note { width: min(760px, calc(100% - 32px)); margin: 16px auto 0; padding: 8px 12px; border-radius: 12px; border: 1px dashed rgba(255,181,154,.5); color: #FFB59A; font-size: 12.5px; text-align: center; }

  .sharp { min-height: 92vh; min-height: 92svh; display: grid; place-content: center; gap: 30px; padding: 40px 16px; text-align: center; isolation: isolate; position: relative; }
  .sharp::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(50% 40% at 50% 62%, rgba(255,90,87,.22), transparent 70%); }
  h2 { font-size: clamp(30px, 8.4vw, 72px); font-weight: 900; line-height: 1.05; letter-spacing: -.01em; }
  h2 span { display: block; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .stack { width: min(400px, 100%); margin-inline: auto; display: grid; gap: 10px; }
  .n { display: grid; grid-template-columns: 40px 1fr auto; gap: 11px; align-items: center; text-align: right; padding: 12px 14px; border-radius: 22px;
       background: rgba(255,255,255,.95); color: #111; box-shadow: 0 18px 40px -14px rgba(0,0,0,.8); }
  .n .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 21px; font-weight: 900; color: #fff; }
  .n b { display: block; font-size: 15px; } .n span { font-size: 13.5px; color: #444; } .n small { font-size: 11px; color: #888; align-self: start; }
  .like .ic { background: linear-gradient(135deg, #FD92A3, #FF5A57); }
  .like { opacity: .92; }
  .paid .ic { background: #1b9e55; }
  .paid b { font-size: 16px; } .paid span { color: #c0392b; font-weight: 900; font-size: 15px; }
  .paid { box-shadow: 0 0 0 3px rgba(255,90,87,.65), 0 26px 50px -12px rgba(255,60,50,.55); }

  /* the hit: like drops in, then the payment slams on top */
  @media (prefers-reduced-motion: no-preference) {
    .like { animation: drop .5s cubic-bezier(.2,1.3,.4,1) .2s both; }
    .paid { animation: slam .55s cubic-bezier(.2,1.5,.4,1) 1.1s both; }
    h2 span { animation: fade .6s ease 1.5s both; }
    .sub { animation: fade .6s ease 1.9s both; }
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px); } }
  @keyframes slam { 0% { opacity: 0; transform: translateY(-60px) scale(1.15); } 70% { transform: translateY(4px) scale(.98); } 100% { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } }
  .sub { font-size: clamp(16px, 2.2vw, 20px); color: var(--ink-2); line-height: 1.5; }
  .sub b { color: #fff; }
  .ill { font-size: 11px; color: var(--ink-3); margin-top: -18px; }
</style>
</head>
<body>
<p class="note">אופציה לבדיקה בלבד. הדף באתר לא השתנה.</p>

<section class="sharp">
  <h2>איזה באסה להיות העסק שהלקוח הכי אוהב,<span>כשהמתחרה שלכם הוא העסק שהוא משלם לו.</span></h2>

  <div class="stack" aria-hidden="true">
    <div class="n like"><span class="ic">♥</span><div><b>הלקוחה שלך</b><span>אהבה את הפוסט שלך</span></div><small>עכשיו</small></div>
    <div class="n paid"><span class="ic">₪</span><div><b>הלקוחה שלך שילמה עכשיו.</b><span>למתחרה שלך.</span></div><small>עכשיו</small></div>
  </div>
  <p class="ill">המחשה</p>

  <p class="sub">כולם לימדו אתכם לגרום ללקוח <b>להתאהב.</b><br>אף אחד לא לימד אתכם לגרום לו <b>להחליט.</b></p>
</section>
</body>
</html>
